services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "{{ port }}:{{ port }}"
    environment:
      PORT: "{{ port }}"
      DATABASE_URL: postgresql://devenv:devenv@postgres:5432/devenv
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devenv
      POSTGRES_PASSWORD: devenv
      POSTGRES_DB: devenv
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

volumes:
  pgdata:
